[bar]
order = [ "meow" ]

    [bar.meow]
    capsule_radius = 4
    color = "primary"
    compositor_blur = false
    end = [ "tray", "notifications", "network", "volume", "ram", "battery", "session" ]
    font_family = "MesloLGL Nerd Font"
    font_weight = 700
    icon_color = "tertiary"
    margin_edge = 4
    margin_ends = 4
    padding = 4
    panel_overlap = 0
    radius = 4
    thickness = 28
    widget_spacing = 4

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@DP-3", "lockscreen-login-box@DP-2" ]

